<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <title>Panel · Yamileth Gill</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/assets/app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/resumen">
        <img src="/logo.png" alt="" width="40" height="40">
        <div><strong>Yamileth Gill</strong><span>Panel de resultados</span></div>
      </a>
      <nav class="nav" id="nav" aria-label="Secciones del panel"></nav>
      <div class="side__foot nav">
        <a href="/" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
          Ver la landing
        </a>
        <a href="#" data-logout>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Cerrar sesión
        </a>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="mobile-brand">
        <img src="/logo.png" alt="" width="32" height="32">
        <strong>Panel de Yamileth</strong>
        <button class="btn btn--icon" type="button" data-logout aria-label="Cerrar sesión">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
      <header class="top">
        <div>
          <h1 id="page-title">Resumen</h1>
          <p id="page-sub"></p>
        </div>
        <div class="top__actions">
          <div class="seg" id="range" role="group" aria-label="Período">
            <button type="button" data-days="7">7 días</button>
            <button type="button" data-days="30">30 días</button>
            <button type="button" data-days="90">90 días</button>
            <button type="button" data-days="0">Todo</button>
          </div>
          <button class="btn btn--icon" type="button" id="refresh" aria-label="Actualizar datos">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <span class="live" title="Los datos se actualizan solos cada 30 segundos"><i></i>En vivo</span>
        </div>
      </header>
      <div id="banner"></div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Secciones del panel"></nav>
  <div class="toast" id="toast" role="status"></div>

  <script src="/dashboard/assets/charts.js"></script>
  <script src="/dashboard/assets/app.js"></script>
</body>
</html>
